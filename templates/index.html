<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI音楽メーカー</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
  >
</head>

<body>
  <main class="container">
    <section class="title-area">
      <h1>ブロックでつくる AI音楽メーカー</h1>

      <p>
        好きなカードをタッチして、
        音楽の材料をえらぼう！
      </p>
    </section>

    {% if error %}
      <div
        class="error-box"
        role="alert"
      >
        {{ error }}
      </div>
    {% endif %}

    <form
      action="/create"
      method="post"
      class="card-form"
    >
      <!-- カテゴリ切り替え -->
      <nav
        id="categoryTabs"
        class="category-tabs"
        aria-label="選択項目"
      >
        {% for category in categories %}
          <button
            type="button"
            class="category-tab{% if loop.first %} is-active{% endif %}"
            data-category="{{ category.id }}"
          >
            <span class="category-title">
              {{ category.title }}
            </span>

            <span
              class="category-result"
              data-result="{{ category.id }}"
            >
              まだえらんでいません
            </span>
          </button>
        {% endfor %}
      </nav>

      <!-- 選択中カテゴリの説明 -->
      <section class="card-section">
        <h2 id="categoryTitle">
          {{ categories[0].title }}をえらぼう
        </h2>

        <p id="categoryDescription">
          {{ categories[0].description }}
        </p>

        <!-- カード表示欄 -->
        <div
          id="cardGrid"
          class="card-grid"
        ></div>
      </section>

      <!-- 選択値をFlaskへ送る -->
      {% for category in categories %}
        <input
          type="hidden"
          name="{{ category.id }}"
          id="selected-{{ category.id }}"
        >
      {% endfor %}

      <!-- 選択済みカード -->
      <section class="selected-section">
        <h2>えらんだカード</h2>

        <div
          id="selectedCards"
          class="selected-grid"
        ></div>
      </section>

      <div class="notice-box">
        選び直したいときは、
        項目をタッチして別のカードをえらんでね。
      </div>

      <button
        type="submit"
        class="submit-button"
        disabled
      >
        つぎへ
      </button>
    </form>
  </main>

  <script
  id="category-data"
  type="application/json"
>
  {{ categories | tojson }}
</script>

<script
  src="{{ url_for('static', filename='js/index.js') }}"
></script>
</body>
</html>
